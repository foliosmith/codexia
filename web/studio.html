<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codexia Studio</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5f2; --panel:#fff; --text:#20221f; --muted:#70746d; --line:#dfe1dc; --accent:#315f50; --soft:#e5efea; --bad:#a33d36; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    @media (prefers-color-scheme:dark) { :root { --bg:#171916; --panel:#20231f; --text:#eceee9; --muted:#a9afa6; --line:#383d36; --accent:#91c9b5; --soft:#263b33; --bad:#f19a90; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); } button,input,textarea,select { font:inherit; } button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    header { height:54px; padding:0 18px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:10; }
    header strong { white-space:nowrap; } header a { color:var(--accent); margin-left:auto; }
    .tabs { display:flex; gap:3px; overflow:auto; }
    .tab { border:0; padding:8px 10px; border-radius:6px; background:transparent; color:var(--muted); white-space:nowrap; }
    .tab[aria-selected="true"] { background:var(--soft); color:var(--text); }
    main { max-width:1320px; margin:0 auto; padding:22px; }
    .title-row { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:18px; } h1 { margin:0; font-size:26px; } h2 { font-size:18px; } h3 { font-size:15px; }
    .muted { color:var(--muted); } .error { color:var(--bad); } .grid { display:grid; grid-template-columns:280px minmax(0,1fr); gap:14px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; min-width:0; }
    .panel h2,.panel h3 { margin-top:0; } .list { max-height:calc(100vh - 180px); overflow:auto; }
    .item { width:100%; border:0; border-radius:5px; padding:8px; text-align:left; background:transparent; color:var(--text); }
    .item:hover,.item[aria-current="true"] { background:var(--soft); }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
    .toolbar input,.toolbar select { border:1px solid var(--line); border-radius:6px; padding:7px; background:var(--bg); color:var(--text); }
    .button,.primary { border:1px solid var(--line); border-radius:6px; padding:8px 11px; background:var(--panel); color:var(--text); }
    .primary { background:var(--accent); border-color:var(--accent); color:var(--bg); }
    textarea.code { width:100%; min-height:420px; resize:vertical; border:1px solid var(--line); border-radius:6px; padding:12px; background:#151714; color:#e9ece7; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:2; }
    pre { overflow:auto; white-space:pre-wrap; word-break:break-word; background:var(--bg); padding:10px; border-radius:6px; }
    .tree ul { margin:4px 0 4px 18px; padding:0; } .tree li { margin:5px 0; }
    .metric-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; }
    .metric { min-width:0; overflow-wrap:anywhere; border:1px solid var(--line); border-radius:7px; padding:11px; } .metric strong { display:block; font-size:20px; margin-top:4px; }
    .pill { display:inline-block; padding:3px 6px; border-radius:10px; background:var(--soft); color:var(--muted); font-size:12px; }
    .source { border:0; padding:3px 0; color:var(--accent); background:transparent; display:block; }
    .source-preview { position:sticky; bottom:8px; border:1px solid var(--accent); background:var(--panel); padding:12px; border-radius:7px; }
    .diff { display:grid; grid-template-columns:180px 1fr 1fr; gap:6px; align-items:start; border-bottom:1px solid var(--line); padding:7px 0; font-size:13px; }
    .entity-graph { width:100%; height:360px; border:1px solid var(--line); border-radius:7px; }
    .empty { padding:24px 0; color:var(--muted); }
    @media (max-width:800px) { header { height:auto; padding:10px; align-items:flex-start; flex-wrap:wrap; } .tabs { order:3; width:100%; } main { padding:14px; } .grid { grid-template-columns:1fr; } .list { max-height:220px; } .metric-grid { grid-template-columns:repeat(2,1fr); } .diff { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><strong>Book Agent Studio</strong><nav class="tabs" aria-label="Studio 工具"><button class="tab" data-tab="package">Package</button><button class="tab" data-tab="chapters">Chapters</button><button class="tab" data-tab="concepts">Concepts</button><button class="tab" data-tab="claims">Claims</button><button class="tab" data-tab="entities">Entities</button><button class="tab" data-tab="validation">Validation</button><button class="tab" data-tab="versions">Versions</button><button class="tab" data-tab="eval">Golden & Eval</button></nav><a href="/">Reader</a></header>
  <main id="app" aria-live="polite"></main>
  <script>
    const app=document.querySelector('#app'); const state={snapshot:null,tab:'package',selectedChapter:null,selectedConcept:null,selectedClaim:null,source:null};
    const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function api(path,options={}) { const response=await fetch(path,{headers:{'Content-Type':'application/json'},...options}); const value=await response.json(); if(!response.ok) throw new Error(value.error?.message||`HTTP ${response.status}`); return value; }
    const send=(method,value)=>({method,body:JSON.stringify(value)});
    async function load(){ try{state.snapshot=await api('/v1/studio/snapshot'); state.selectedChapter ||= Object.keys(state.snapshot.chapters)[0]; state.selectedConcept ||= state.snapshot.concepts[0]?.concept_id; state.selectedClaim ||= state.snapshot.claims[0]?.claim_id; render();}catch(error){app.innerHTML=`<p class="error">${esc(error.message)}</p>`;} }
    function render(){ document.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',button.dataset.tab===state.tab)); const body={package:packageView,chapters:chapterView,concepts:conceptView,claims:claimView,entities:entityView,validation:validationView,versions:versionsView,eval:evalView}[state.tab](); app.innerHTML=`<div class="title-row"><div><div class="muted">revision ${state.snapshot.revision}</div><h1>${esc(state.snapshot.title)}</h1></div><span class="pill">${esc(state.snapshot.source_hash.slice(0,16))}</span></div>${body}`; bind(); }
    function bind(){ document.querySelectorAll('[data-select-chapter]').forEach(button=>button.onclick=()=>{state.selectedChapter=button.dataset.selectChapter;render();}); document.querySelectorAll('[data-select-concept]').forEach(button=>button.onclick=()=>{state.selectedConcept=button.dataset.selectConcept;render();}); document.querySelectorAll('[data-select-claim]').forEach(button=>button.onclick=()=>{state.selectedClaim=button.dataset.selectClaim;render();}); document.querySelectorAll('[data-source]').forEach(button=>button.onclick=()=>showSource(button.dataset.source)); document.querySelector('#save-chapter')?.addEventListener('click',saveChapter); document.querySelector('#reanalyze')?.addEventListener('click',reanalyze); document.querySelector('#save-concept')?.addEventListener('click',saveConcept); document.querySelector('#save-claim')?.addEventListener('click',saveClaim); document.querySelector('#compare')?.addEventListener('click',compareVersions); document.querySelector('#run-eval')?.addEventListener('click',runEval); document.querySelector('#mark-golden')?.addEventListener('click',markGolden); document.querySelector('#golden-file')?.addEventListener('change',importGolden); document.querySelector('#filter')?.addEventListener('input',renderFiltered); }
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{state.tab=button.dataset.tab;render();});

    function packageView(){ return `<div class="grid"><section class="panel tree"><h2>Structure tree</h2>${treeHtml(state.snapshot.structure.toc||[])}</section><section class="panel"><h2>Package summary</h2><pre>${esc(JSON.stringify({chapters:Object.keys(state.snapshot.chapters).length,concepts:state.snapshot.concepts.length,claims:state.snapshot.claims.length,versions:state.snapshot.version_counts},null,2))}</pre><h2>Eval report</h2>${metricsHtml(state.snapshot.eval_report.stats||{})}</section></div>`; }
    function treeHtml(items){ if(!items.length)return '<p class="empty">No structure entries.</p>'; const branch=children=>children?.length?`<ul>${children.map(item=>`<li>${esc(item.label)}${branch(item.children)}</li>`).join('')}</ul>`:''; return branch(items); }
    function chapterView(){ const entries=Object.entries(state.snapshot.chapters); const analysis=state.snapshot.chapters[state.selectedChapter]; return `<div class="grid"><aside class="panel list"><h2>Chapter analyses</h2>${entries.map(([id,item])=>`<button class="item" data-select-chapter="${esc(id)}" aria-current="${id===state.selectedChapter}">${esc(item.chapter_title)}</button>`).join('')}</aside><section class="panel"><h2>${esc(analysis?.chapter_title||'Chapter')}</h2>${analysis?`<div class="toolbar"><button class="primary" id="save-chapter">保存修正</button><button class="button" id="reanalyze">重新分析</button></div><textarea class="code" id="chapter-json">${esc(JSON.stringify(analysis,null,2))}</textarea><h3>Argument flow</h3><pre>${esc(JSON.stringify(analysis.argument_flow||[],null,2))}</pre><h3>Difficult passages</h3>${sourceRefs(analysis.difficult_passages?.map(item=>item.source_ref)||[])}`:'<p class="empty">No analysis.</p>'}<div id="action-result"></div>${sourcePreview()}</section></div>`; }
    function conceptView(){ const concepts=state.snapshot.concepts; const selected=concepts.find(item=>item.concept_id===state.selectedConcept); return `<div class="toolbar"><input id="filter" placeholder="筛选 concept"><select id="sort"><option value="importance">按重要度</option><option value="name">按名称</option></select></div><div class="grid"><aside class="panel list" id="filtered-list">${conceptList(concepts)}</aside><section class="panel">${selected?`<h2>${esc(selected.name)}</h2><button class="primary" id="save-concept">保存修正</button><textarea class="code" id="concept-json">${esc(JSON.stringify(selected,null,2))}</textarea><h3>Relations</h3><pre>${esc(JSON.stringify(selected.related_concepts||[],null,2))}</pre>${sourceRefs(selected.appearances||[])}`:'<p class="empty">No concepts.</p>'}<div id="action-result"></div>${sourcePreview()}</section></div>`; }
    function conceptList(items){return items.map(item=>`<button class="item" data-select-concept="${esc(item.concept_id)}" aria-current="${item.concept_id===state.selectedConcept}">${esc(item.name)} · ${item.importance}</button>`).join('')||'<p class="empty">No concepts.</p>';}
    function claimView(){ const claims=state.snapshot.claims; const selected=claims.find(item=>item.claim_id===state.selectedClaim); return `<div class="grid"><aside class="panel list"><h2>Claims</h2>${claims.map(item=>`<button class="item" data-select-claim="${esc(item.claim_id)}" aria-current="${item.claim_id===state.selectedClaim}">${esc(item.claim)}</button>`).join('')||'<p class="empty">No claims.</p>'}</aside><section class="panel">${selected?`<h2>${esc(selected.claim)}</h2><button class="primary" id="save-claim">保存修正</button><textarea class="code" id="claim-json">${esc(JSON.stringify(selected,null,2))}</textarea><h3>Evidence</h3>${sourceRefs(selected.supporting_evidence?.map(item=>item.source_ref)||[])}`:'<p class="empty">No claims.</p>'}<div id="action-result"></div>${sourcePreview()}</section></div>`; }
    function entityView(){ const entities=state.snapshot.entities.entities||[]; return `<section class="panel"><h2>Entity graph</h2>${entities.length?`<svg class="entity-graph" viewBox="0 0 900 360" role="img" aria-label="Entity relations">${entityGraph(entities)}</svg><div>${entities.map(item=>`<p><strong>${esc(item.name)}</strong> · ${esc(item.type)} · ${item.importance}</p>`).join('')}</div>`:'<p class="empty">No entities in this package.</p>'}</section>`; }
    function entityGraph(entities){ const nodes=entities.slice(0,20); const position=new Map(nodes.map((item,index)=>[item.entity_id,{x:90+(index%5)*175,y:55+Math.floor(index/5)*90}])); const lines=nodes.flatMap(item=>(item.relations||[]).map(rel=>{const a=position.get(item.entity_id),b=position.get(rel.entity_id);return a&&b?`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="currentColor" opacity=".3"/>`:''})).join(''); const circles=nodes.map(item=>{const p=position.get(item.entity_id);return `<g><circle cx="${p.x}" cy="${p.y}" r="28" fill="var(--soft)" stroke="var(--accent)"/><text x="${p.x}" y="${p.y+43}" text-anchor="middle" fill="currentColor" font-size="11">${esc(item.name).slice(0,22)}</text></g>`}).join(''); return lines+circles; }
    function validationView(){ const validation=state.snapshot.source_ref_validation; return `<section class="panel"><h2>Source reference validation</h2><p class="${validation.valid?'':'error'}">${validation.valid?'Valid':'Invalid'}</p>${metricsHtml(validation.stats||{})}<h3>Warnings and errors</h3>${validation.issues?.length?validation.issues.map(item=>`<p><span class="pill">${esc(item.severity)}</span> ${esc(item.code)} · ${esc(item.path)}<br><span class="muted">${esc(item.message)}</span></p>`).join(''):'<p class="empty">No issues.</p>'}<h2>Package eval_report</h2><pre>${esc(JSON.stringify(state.snapshot.package_eval_report,null,2))}</pre><h2>Effective eval_report</h2><pre>${esc(JSON.stringify(state.snapshot.eval_report,null,2))}</pre></section>`; }
    function metricsHtml(metrics){const percentages=new Set(['parse_quality','source_ref_validity','chapter_coverage','claim_grounding','concept_grounding','summary_coverage_basis_points']);return `<div class="metric-grid">${Object.entries(metrics).slice(0,5).map(([name,value])=>`<div class="metric"><span class="muted">${esc(name)}</span><strong>${typeof value==='number'&&percentages.has(name)?esc(Math.round(value/100)+'%'):(value && typeof value==='object' ? esc(value.value_basis_points == null ? value.state : Math.round(value.value_basis_points/100)+'%') : esc(value))}</strong>${value?.reason ? `<small>${esc(value.reason)}</small>` : ''}</div>`).join('')}</div>`;}
    function versionsView(){ return `<section class="panel"><h2>Analyzer versions</h2><div class="toolbar"><select id="version-kind"><option value="chapter">Chapter</option><option value="concept">Concept</option><option value="claim">Claim</option></select><input id="version-id" value="${esc(state.selectedChapter||'')}"><button class="primary" id="compare">比较 base 与最新版本</button></div><div id="diff-result" class="empty">选择对象后比较。</div></section>`; }
    function evalView(){ const latest=state.snapshot.eval_runs.at(-1); return `<section class="panel"><h2>Eval Pipeline</h2><button class="primary" id="run-eval">运行结构评估</button>${latest?`<h3>Latest · ${esc(latest.run_id)}</h3>${metricsHtml(latest.metrics)}<p>语义审核：${esc(latest.semantic?.state || "not_evaluated")} · Beta：${latest.beta_ready ? "通过抽样门禁" : "未通过 / 未评估"}</p><h3>Regressions</h3>${latest.regressions.length?latest.regressions.map(esc).join('<br>'):'<p class="empty">No regressions.</p>'}`:'<p class="empty">No eval runs.</p>'}</section><section class="panel"><h2>Golden Books</h2><div class="toolbar"><input id="golden-label" placeholder="Golden label"><button class="primary" id="mark-golden">标记当前版本</button><label class="button">导入 JSON<input id="golden-file" type="file" accept="application/json" hidden></label></div><label>人工标注（JSON）<textarea class="code" id="golden-annotations" style="min-height:120px">{}</textarea></label>${state.snapshot.golden_books.map(item=>`<p><strong>${esc(item.label)}</strong><br><span class="muted">${esc(item.golden_id)} · ${esc(item.source_hash.slice(0,16))}</span></p>`).join('')||'<p class="empty">No Golden Books.</p>'}<div id="action-result"></div></section>`; }
    function sourceRefs(refs){return refs.map(ref=>`<button class="source" data-source="${esc(ref.block_id)}">${esc(ref.block_id)} · ${ref.start_char}..${ref.end_char}</button>`).join('')||'<p class="empty">No source refs.</p>';}
    function sourcePreview(){return state.source?`<div class="source-preview"><strong>${esc(state.source.block_id)}</strong><p>${esc(state.source.text)}</p></div>`:'';}

    async function showSource(id){try{state.source=await api(`/v1/studio/sources/${encodeURIComponent(id)}`);render();}catch(error){showResult(error.message,true);}}
    async function saveChapter(){await saveJson(`/v1/studio/chapters/${state.selectedChapter}`,'chapter-json');}
    async function reanalyze(){try{const result=await api(`/v1/studio/chapters/${state.selectedChapter}/reanalyze`,send('POST',{analyzer_label:'studio'}));showResult(`Saved ${result.version_id}`);await load();}catch(error){showResult(error.message,true);}}
    async function saveConcept(){await saveJson(`/v1/studio/concepts/${state.selectedConcept}`,'concept-json');}
    async function saveClaim(){await saveJson(`/v1/studio/claims/${state.selectedClaim}`,'claim-json');}
    async function saveJson(path,id){try{const value=JSON.parse(document.getElementById(id).value);const result=await api(path,send('PUT',value));showResult(`Saved ${result.version_id}`);await load();}catch(error){showResult(error.message,true);}}
    async function compareVersions(){try{const kind=document.querySelector('#version-kind').value,id=document.querySelector('#version-id').value;const versions=await api(`/v1/studio/${kind==='chapter'?'chapters':kind==='concept'?'concepts':'claims'}/${encodeURIComponent(id)}/versions`);const latest=versions.at(-1);const diffs=await api('/v1/studio/compare',send('POST',{kind,id,left_version:'base',right_version:latest.version_id}));document.querySelector('#diff-result').innerHTML=diffs.length?diffs.map(item=>`<div class="diff"><strong>${esc(item.path)}</strong><pre>${esc(JSON.stringify(item.left))}</pre><pre>${esc(JSON.stringify(item.right))}</pre></div>`).join(''):'<p class="empty">No differences.</p>';}catch(error){document.querySelector('#diff-result').textContent=error.message;}}
    async function runEval(){try{await api('/v1/studio/evals',send('POST',{}));await load();}catch(error){showResult(error.message,true);}}
    async function markGolden(){try{const label=document.querySelector('#golden-label').value,annotations=JSON.parse(document.querySelector('#golden-annotations').value);await api('/v1/studio/golden-books',send('POST',{label,annotations}));await load();}catch(error){showResult(error.message,true);}}
    async function importGolden(event){const file=event.target.files[0];if(!file)return;try{const value=JSON.parse(await file.text());await api('/v1/studio/golden-books/import',send('POST',value));await load();}catch(error){showResult(error.message,true);}}
    function renderFiltered(){const query=document.querySelector('#filter').value.toLowerCase(),sort=document.querySelector('#sort').value;const items=state.snapshot.concepts.filter(item=>(item.name+' '+item.aliases.join(' ')).toLowerCase().includes(query)).sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):b.importance-a.importance);document.querySelector('#filtered-list').innerHTML=conceptList(items);document.querySelectorAll('[data-select-concept]').forEach(button=>button.onclick=()=>{state.selectedConcept=button.dataset.selectConcept;render();});}
    function showResult(message,isError=false){const target=document.querySelector('#action-result');if(target){target.textContent=message;target.className=isError?'error':'muted';}}
    load();
  </script>
</body>
</html>
